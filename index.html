let filter='전체',current=0,repeat=true,linked={};const grid=document.querySelector('#grid'),video=document.querySelector('#video'),overlay=document.querySelector('#overlay');
function render(){const cats=['전체',...new Set(videos.map(v=>v.part))];document.querySelector('#filters').innerHTML=cats.map(c=>`<button class="${c===filter?'active':''}" data-cat="${c}">${c}</button>`).join('');let q=document.querySelector('#search').value.trim().toLowerCase();grid.innerHTML='';let shown=0;videos.forEach((v,i)=>{if(filter!=='전체'&&v.part!==filter)return;if(q&&!`${v.title} ${v.exercise} ${v.file}`.toLowerCase().includes(q))return;shown++;let b=document.createElement('button');b.className='card';b.innerHTML=`<img src="${v.image}" alt="${v.exercise} 대표 장면"><div class="txt"><span class="number">${String(i+1).padStart(2,'0')} · ${v.part}</span><strong>${v.exercise}</strong><small>${v.title}</small></div>`;b.onclick=()=>play(i);grid.appendChild(b)});document.querySelector('#count').textContent=`운동 영상 ${shown}개 표시 / 전체 ${videos.length}개`;}
document.querySelector('#filters').onclick=e=>{if(e.target.dataset.cat){filter=e.target.dataset.cat;render()}};document.querySelector('#search').oninput=render;
function play(i){current=(i+videos.length)%videos.length;let v=videos[current];document.querySelector('#ptitle').textContent=v.exercise+' · '+v.title;document.querySelector('#desc').textContent=`${v.exercise} · ${v.file} · 원본 소리 포함`;overlay.classList.add('open');video.src=v.file+"?v=2";video.load();video.play().catch(()=>{});}
document.querySelector('#close').onclick=()=>{video.pause();overlay.classList.remove('open')};document.querySelector('#prev').onclick=()=>play(current-1);document.querySelector('#next').onclick=()=>play(current+1);document.querySelector('#repeat').onclick=()=>{repeat=!repeat;document.querySelector('#repeat').textContent=repeat?'🔁 반복 켜짐':'➡️ 연속 재생';};video.onended=()=>play(repeat?current:current+1);video.onerror=()=>{document.querySelector('#desc').textContent='영상 재생에 실패했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'};render();
document.querySelector("#togglePlay").onclick=()=>video.paused?video.play():video.pause();const seek=document.querySelector("#seek");video.addEventListener("timeupdate",()=>{if(video.duration)seek.value=1000*video.currentTime/video.duration});seek.oninput=()=>{if(video.duration)video.currentTime=video.duration*seek.value/1000};document.querySelector("#full").onclick=()=>{if(video.requestFullscreen)video.requestFullscreen().catch(()=>{});else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen()};</script><script>if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body></html>

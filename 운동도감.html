function render(){const cats=['전체',...new Set(videos.map(v=>v.part))];document.querySelector('#filters').innerHTML=cats.map(c=>`<button class="${c===filter?'active':''}" data-cat="${c}">${c}</button>`).join('');let q=document.querySelector('#search').value.trim().toLowerCase();grid.innerHTML='';let shown=0;videos.forEach((v,i)=>{if(filter!=='전체'&&v.part!==filter)return;if(q&&!`${v.title} ${v.exercise} ${v.file}`.toLowerCase().includes(q))return;shown++;let b=document.createElement('button');b.className='card';b.innerHTML=`<img src="${v.image}" alt="${v.exercise} 대표 장면"><div class="txt"><span class="number">${String(i+1).padStart(2,'0')} · ${v.part}</span><strong>${v.title}</strong><small>${v.exercise}</small></div>`;b.onclick=()=>play(i);grid.appendChild(b)});document.querySelector('#count').textContent=`운동 영상 ${shown}개 표시 / 전체 ${videos.length}개`;}
document.querySelector('#filters').onclick=e=>{if(e.target.dataset.cat){filter=e.target.dataset.cat;render()}};document.querySelector('#search').oninput=render;
document.querySelector('#folder').onchange=e=>{Object.values(linked).forEach(u=>URL.revokeObjectURL(u));linked={};for(const f of e.target.files)linked[f.name]=URL.createObjectURL(f);alert(`영상 ${Object.keys(linked).length}개 연결했어요!`);};
function play(i){current=(i+videos.length)%videos.length;let v=videos[current];document.querySelector('#ptitle').textContent=v.title;document.querySelector('#desc').textContent=`${v.exercise} · ${v.file} · 원본 소리 포함`;overlay.classList.add('open');video.src=linked[v.file]||v.file;video.load();video.play().catch(()=>{});}
document.querySelector('#close').onclick=()=>{video.pause();overlay.classList.remove('open')};document.querySelector('#prev').onclick=()=>play(current-1);document.querySelector('#next').onclick=()=>play(current+1);document.querySelector('#repeat').onclick=()=>{repeat=!repeat;document.querySelector('#repeat').textContent=repeat?'🔁 반복 켜짐':'➡️ 연속 재생';};video.onended=()=>play(repeat?current:current+1);video.onerror=()=>{document.querySelector('#desc').textContent='영상을 찾지 못했어요. HTML과 MP4를 같은 폴더에 넣거나 상단의 영상 폴더 연결을 이용하세요.'};render();
